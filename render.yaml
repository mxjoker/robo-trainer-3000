databases:
  - name: robo-trainer-db
    plan: free
    databaseName: robo_trainer
    user: robo_trainer

services:
  - type: web
    name: robo-trainer-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: robo-trainer-db
          property: connectionString
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: CLIENT_ORIGIN
        sync: false   # set after Netlify deploy — your Netlify URL
